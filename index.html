<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validating HTML Forms with JavaScript</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/form-validation.js"></script>
</head>
<body>
    <!-- Michael Barnes - September 14, 2026 -->

    <header>
        <h1>Validating HTML Forms with JavaScript</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main>
        <h2>Contact Form</h2>

        <form id="contact-form" autocomplete="on">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" class="required" autocomplete="name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" class="required" autocomplete="email">

            <label for="subject">Subject:</label>
            <select id="subject" name="subject" class="required">
                <option value="">Select a subject</option>
                <option value="question">Question</option>
                <option value="comment">Comment</option>
                <option value="other">Other</option>
            </select>

            <input type="button" id="submit-button" value="Submit">
        </form>

        <span id="missing-count" aria-live="polite"></span>
        <span id="success-message" aria-live="polite"></span>
    </main>

    <footer>
        <p>&copy; 2026 Michael Barnes</p>
    </footer>
</body>
</html>
